{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<section class="auth-wrap"><div class="auth-side"><span class="eyebrow">JOIN THE GARAGE</span><h1>Build it<br>your way.</h1><p>Create an account to order parts and keep an eye on every request.</p></div><form method="post" class="auth-card"><span class="eyebrow dark">NEW RIDER</span><h2>Create account</h2><label>Full name<input name="name" required maxlength="100"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password <small>(at least 8 characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button button-dark full">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>
{% endblock %}
